[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-recipes"
version = "0.1.0"
description = "Single-command LoRA fine-tuning recipes for small open LLMs with reproducible before/after eval. CPU-trainable defaults; GPU-friendly configs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
keywords = ["lora", "peft", "fine-tuning", "llm", "huggingface", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "datasets>=2.20",
    "accelerate>=0.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lora-train = "lora_recipes.train:main"
lora-eval = "lora_recipes.eval:main"

[project.urls]
Homepage = "https://github.com/Tajaddin/lora-finetune-recipes"
Repository = "https://github.com/Tajaddin/lora-finetune-recipes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
